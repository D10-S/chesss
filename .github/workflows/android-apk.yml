name: Build downloadable Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK for download
        run: mkdir -p dist && cp app/build/outputs/apk/debug/app-debug.apk dist/chess-debug.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-debug-apk
          path: dist/chess-debug.apk
          if-no-files-found: error
