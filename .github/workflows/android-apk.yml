name: Build downloadable Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Prepare Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/chess-debug.apk

      - name: Upload chess APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-debug-apk
          path: dist/chess-debug.apk
          if-no-files-found: error
